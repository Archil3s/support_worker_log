<!DOCTYPE html>
<html>
<head>
<!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track mood, gym, sleep, stress, and daily patterns.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mood Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mood Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      deferredInstallPrompt = event;
    });

    window.supportWorkerLogInstallApp = async function() {
      if (!deferredInstallPrompt) return false;

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return true;
    };

    let activeSpeechRecognition = null;

    window.supportWorkerLogStopSpeechToText = function() {
      if (!activeSpeechRecognition) return;

      try {
        activeSpeechRecognition.stop();
      } catch (_) {
        activeSpeechRecognition = null;
      }
    };

    window.supportWorkerLogSpeechToText = function() {
      return new Promise(function(resolve) {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          resolve(null);
          return;
        }

        const recognition = new SpeechRecognition();
        let finished = false;
        let pendingParagraphBreak = false;
        let silenceTimer = null;
        const segments = [];
        const silenceBreakMs = 5000;

        activeSpeechRecognition = recognition;
        recognition.lang = navigator.language || 'en-NZ';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        const transcriptText = function() {
          return segments
            .join(' ')
            .replace(/\s+\n\n\s+/g, '\n\n')
            .replace(/[ \t]{2,}/g, ' ')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
        };

        const finish = function(value) {
          if (finished) return;
          finished = true;
          if (silenceTimer) clearTimeout(silenceTimer);
          if (activeSpeechRecognition === recognition) {
            activeSpeechRecognition = null;
          }
          resolve(value || null);
        };

        const armSilenceTimer = function() {
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(function() {
            if (segments.length > 0) pendingParagraphBreak = true;
          }, silenceBreakMs);
        };

        recognition.onresult = function(event) {
          for (let index = event.resultIndex; index < event.results.length; index++) {
            const item = event.results[index];
            if (!item || !item.isFinal || !item[0] || !item[0].transcript) {
              continue;
            }

            const text = item[0].transcript.trim();
            if (!text) continue;

            if (pendingParagraphBreak && segments.length > 0) {
              segments.push('\n\n');
            }
            segments.push(text);
            pendingParagraphBreak = false;
            armSilenceTimer();
          }
        };

        recognition.onerror = function() {
          finish(transcriptText());
        };

        recognition.onend = function() {
          finish(transcriptText());
        };

        recognition.start();
      });
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      });
    }

    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          caches.delete(key);
        });
      });
    }
  </script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
