<!DOCTYPE html>
<html>
<head>
<!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track support work, notes, invoices, and actions.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Support Worker Log">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Support Worker Log</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090e17;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #090e17;
    }

    #app-loader-content {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    #app-loader-mark {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      border: 1px solid #34405f;
      border-radius: 20px;
      background: #151b29;
      color: #4f8df7;
      font-size: 30px;
      font-weight: 900;
    }

    #app-loader-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #34405f;
      border-top-color: #4f8df7;
      border-radius: 50%;
      animation: app-loader-spin 0.8s linear infinite;
    }

    @keyframes app-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-label="Opening Support Worker Log">
    <div id="app-loader-content">
      <div id="app-loader-mark">S</div>
      <strong>Support Worker Log</strong>
      <div id="app-loader-spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('app-loader')?.remove();
    });

    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      deferredInstallPrompt = event;
    });

    window.supportWorkerLogInstallApp = async function() {
      if (!deferredInstallPrompt) return false;

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return true;
    };

    const biometricCredentialKey =
      'support_worker_log_biometric_credential_v1';

    const randomBytes = function(length) {
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      return bytes;
    };

    const bytesToBase64Url = function(value) {
      let binary = '';
      const bytes = new Uint8Array(value);

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    };

    const base64UrlToBytes = function(value) {
      const padding = '='.repeat((4 - value.length % 4) % 4);
      const base64 = (value + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes;
    };

    window.supportWorkerLogBiometricAvailable = async function() {
      if (!window.isSecureContext ||
          !window.PublicKeyCredential ||
          !PublicKeyCredential
            .isUserVerifyingPlatformAuthenticatorAvailable) {
        return false;
      }

      try {
        return await PublicKeyCredential
          .isUserVerifyingPlatformAuthenticatorAvailable();
      } catch (_) {
        return false;
      }
    };

    window.supportWorkerLogBiometricEnrolled = async function() {
      try {
        return Boolean(localStorage.getItem(biometricCredentialKey));
      } catch (_) {
        return false;
      }
    };

    window.supportWorkerLogEnrollBiometric = async function() {
      if (!await window.supportWorkerLogBiometricAvailable()) return false;

      try {
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: randomBytes(32),
            rp: {
              name: 'Support Worker Log'
            },
            user: {
              id: randomBytes(16),
              name: 'support-worker-log-local-lock',
              displayName: 'Support Worker Log'
            },
            pubKeyCredParams: [
              { type: 'public-key', alg: -7 },
              { type: 'public-key', alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: 'platform',
              residentKey: 'preferred',
              userVerification: 'required'
            },
            timeout: 60000,
            attestation: 'none'
          }
        });

        if (!credential) return false;

        localStorage.setItem(
          biometricCredentialKey,
          bytesToBase64Url(credential.rawId)
        );
        return true;
      } catch (_) {
        return false;
      }
    };

    window.supportWorkerLogAuthenticateBiometric = async function() {
      let storedCredential = null;

      try {
        storedCredential = localStorage.getItem(biometricCredentialKey);
      } catch (_) {
        return false;
      }

      if (!storedCredential ||
          !await window.supportWorkerLogBiometricAvailable()) {
        return false;
      }

      try {
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: randomBytes(32),
            allowCredentials: [{
              id: base64UrlToBytes(storedCredential),
              type: 'public-key',
              transports: ['internal']
            }],
            userVerification: 'required',
            timeout: 60000
          }
        });

        return Boolean(credential);
      } catch (_) {
        return false;
      }
    };

    let activeSpeechRecognition = null;

    window.supportWorkerLogStopSpeechToText = function() {
      if (!activeSpeechRecognition) return;

      try {
        activeSpeechRecognition.stop();
      } catch (_) {
        activeSpeechRecognition = null;
      }
    };

    window.supportWorkerLogSpeechToText = function() {
      return new Promise(function(resolve) {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          resolve(null);
          return;
        }

        const recognition = new SpeechRecognition();
        let finished = false;
        let silenceTimer = null;
        const segments = [];
        const silenceBreakMs = 5000;

        activeSpeechRecognition = recognition;
        recognition.lang = navigator.language || 'en-NZ';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        const transcriptText = function(includeTrailingBreak) {
          const text = segments
            .join(' ')
            .replace(/\s+\n\n\s+/g, '\n\n')
            .replace(/[ \t]{2,}/g, ' ')
            .replace(/\n{3,}/g, '\n\n')
            .trim();

          return includeTrailingBreak && text ? text + '\n\n' : text;
        };

        const finish = function(value) {
          if (finished) return;
          finished = true;
          if (silenceTimer) clearTimeout(silenceTimer);
          if (activeSpeechRecognition === recognition) {
            activeSpeechRecognition = null;
          }
          resolve(value || null);
        };

        const armSilenceTimer = function() {
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(function() {
            finish(segments.length > 0 ? transcriptText(true) : null);
            try {
              recognition.stop();
            } catch (_) {}
          }, silenceBreakMs);
        };

        recognition.onresult = function(event) {
          for (let index = event.resultIndex; index < event.results.length; index++) {
            const item = event.results[index];
            if (!item || !item.isFinal || !item[0] || !item[0].transcript) {
              continue;
            }

            const text = item[0].transcript.trim();
            if (!text) continue;

            segments.push(text);
            armSilenceTimer();
          }
        };

        recognition.onerror = function() {
          finish(transcriptText(false));
        };

        recognition.onend = function() {
          finish(transcriptText(false));
        };

        recognition.start();
        armSilenceTimer();
      });
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      });
    }

    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          caches.delete(key);
        });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
