<!DOCTYPE html>
<html>
<head>
<!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track mood, gym, sleep, stress, and daily patterns.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mood Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mood Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      deferredInstallPrompt = event;
    });

    window.supportWorkerLogInstallApp = async function() {
      if (!deferredInstallPrompt) return false;

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return true;
    };

    window.supportWorkerLogSpeechToText = function() {
      return new Promise(function(resolve) {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          resolve(null);
          return;
        }

        const recognition = new SpeechRecognition();
        let finished = false;

        recognition.lang = navigator.language || 'en-NZ';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = function(event) {
          const result = event.results && event.results[0] && event.results[0][0];
          finished = true;
          resolve(result && result.transcript ? result.transcript : null);
        };

        recognition.onerror = function() {
          if (!finished) {
            finished = true;
            resolve(null);
          }
        };

        recognition.onend = function() {
          if (!finished) {
            finished = true;
            resolve(null);
          }
        };

        recognition.start();
      });
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      });
    }

    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          caches.delete(key);
        });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
