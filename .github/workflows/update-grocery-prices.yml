name: Update Blenheim grocery prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-grocery-prices.yml

permissions:
  contents: write

concurrency:
  group: update-blenheim-grocery-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: tools/rental_scraper

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/rental_scraper/package-lock.json

      - name: Install scraper
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox

      - name: Test scraper
        run: npm test

      - name: Scrape Blenheim supermarkets
        run: npm run scrape:grocery

      - name: Commit updated catalogue
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- tools/rental_scraper/grocery_prices_blenheim.json; then
            echo "Catalogue is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rental_scraper/grocery_prices_blenheim.json
          git commit -m "Update Blenheim grocery prices"
          git pull --rebase origin main
          git push origin HEAD:main
