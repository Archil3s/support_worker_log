name: Refresh Blenheim grocery catalogue

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grocery-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/rental_scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: tools/rental_scraper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tools/rental_scraper
        run: npx playwright install --with-deps chromium firefox

      - name: Refresh Blenheim prices
        working-directory: tools/rental_scraper
        env:
          GROCERY_HEADLESS: 'false'
        run: xvfb-run -a npm run refresh-groceries

      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- tools/rental_scraper/grocery_prices_blenheim.json; then
            echo "Catalogue did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/rental_scraper/grocery_prices_blenheim.json
          git commit -m "Refresh Blenheim grocery prices"
          git push origin HEAD:main
